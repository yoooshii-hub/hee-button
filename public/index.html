<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>へぇボタン 管理者ログイン</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar"><span class="brand">へぇ<span>ボタン</span></span></header>
  <main class="wrap" style="max-width:440px">
    <div class="card">
      <h1>管理者ページ</h1>
      <div class="tabs">
        <button id="tab-login" class="active" type="button">ログイン</button>
        <button id="tab-register" type="button">アカウント作成</button>
      </div>
      <form id="form">
        <label for="username">ユーザー名</label>
        <input id="username" type="text" autocomplete="username" autocapitalize="off" required maxlength="40">
        <label for="password">パスワード（8文字以上）</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="8">
        <div id="code-field" hidden>
          <label for="code">招待コード</label>
          <input id="code" type="text" autocomplete="off" autocapitalize="off">
        </div>
        <div class="error" id="error"></div>
        <button class="btn" style="width:100%;margin-top:8px" id="submit">ログイン</button>
      </form>
    </div>
    <p class="muted">参加者の方はログイン不要です。会場のQRコードまたはURLからアクセスしてください。</p>
  </main>
  <script src="/js/common.js"></script>
  <script>
    let mode = 'login';
    const $ = (id) => document.getElementById(id);
    function setMode(m) {
      mode = m;
      $('tab-login').classList.toggle('active', m === 'login');
      $('tab-register').classList.toggle('active', m === 'register');
      $('code-field').hidden = m === 'login';
      $('submit').textContent = m === 'login' ? 'ログイン' : 'アカウントを作成';
      $('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
      $('error').textContent = '';
    }
    $('tab-login').onclick = () => setMode('login');
    $('tab-register').onclick = () => setMode('register');

    api('/api/me', { allow401: true }).then(() => (location.href = '/room')).catch(() => {});

    $('form').onsubmit = async (e) => {
      e.preventDefault();
      $('error').textContent = '';
      try {
        await api(mode === 'login' ? '/api/login' : '/api/register', {
          method: 'POST',
          allow401: true,
          body: { username: $('username').value, password: $('password').value, code: $('code').value },
        });
        location.href = '/room';
      } catch (err) {
        $('error').textContent = err.message;
      }
    };
  </script>
</body>
</html>
