<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マイルーム</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="topbar"></div>
  <main class="wrap">
    <h1>マイルーム</h1>
    <div class="card">
      <h2>新しいイベントを作成</h2>
      <form id="create" class="row">
        <input id="title" type="text" placeholder="例: 社内忘年会 トリビア大会" style="flex:1;min-width:200px" maxlength="80" required>
        <button class="btn">作成</button>
      </form>
      <div class="error" id="error"></div>
    </div>
    <div class="card">
      <h2>イベント一覧</h2>
      <ul class="event-list" id="list"></ul>
      <p class="muted" id="empty" hidden>まだイベントがありません。上のフォームから作成してください。</p>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    async function load() {
      const { events } = await api('/api/events');
      $('empty').hidden = events.length > 0;
      $('list').innerHTML = events.map((ev) => `
        <li>
          <div>
            <a class="title" href="/room/events/${ev.id}">${escapeHtml(ev.title)}</a>
            <div class="muted">合計 ${ev.total.toLocaleString()} へぇ ・ ${new Date(ev.createdAt).toLocaleDateString('ja-JP')}</div>
          </div>
          <div class="row">
            <span class="badge ${ev.status}">${STATUS_LABEL[ev.status]}</span>
            <a class="btn secondary" href="/room/events/${ev.id}">管理</a>
          </div>
        </li>`).join('');
    }

    api('/api/me').then(({ user }) => {
      $('topbar').innerHTML = topbar(user);
      load();
    });

    $('create').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const { event } = await api('/api/events', { method: 'POST', body: { title: $('title').value } });
        location.href = `/room/events/${event.id}`;
      } catch (err) {
        $('error').textContent = err.message;
      }
    };
  </script>
</body>
</html>
